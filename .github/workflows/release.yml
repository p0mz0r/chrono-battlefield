# A pushed tag v<version> (the version in package.json) builds the release and publishes it as a GitHub release (#210).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
      - run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")" || { echo "Tag $GITHUB_REF_NAME is not v + package.json's version"; exit 1; }
        shell: bash
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: gh release create "$GITHUB_REF_NAME" release/rhino-race-*.zip release/rhino-race.exe release/SHA256SUMS.txt --title "Rhino Race ${GITHUB_REF_NAME#v}" --generate-notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
