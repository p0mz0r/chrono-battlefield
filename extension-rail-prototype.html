<!doctype html>
<!--
  PROTOTYPE, throwaway (#171). Not part of the build; delete once the rail is settled.
  Question: what does the Twitch extension's overlay rail (and its mobile view) look like in each state, where does it sit, how big is it?
  Three rail variants over a mock of the stream view, switchable via ?variant=A|B|C, each in every state (?state=…, or ?state=all).
  The stream behind is a ghost of the real layout in index.html (standings left, phase and queue top right, feed bottom right, commands bottom left).
  The mobile view is one shared design for all variants. Run: double-click, or `npm run prototype:rail`.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Extension rail</title>
<style>
  @font-face { font-family: 'Barlow Condensed'; font-weight: 900; src: url('docs/brand/fonts/BarlowCondensed-Black.ttf'); }
  :root { --red: #bd2020; --red-hi: #e23a3a; --gold: #ffd34e; --ink: #080b10; --dim: #aeb9c6; --s: 1; }
  html, body { margin: 0; min-height: 100%; background: #18181b; color: #efeff1; font: 14px/1.35 'Segoe UI', sans-serif; }
  main { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; padding: 20px 20px 130px; }
  .cap { margin: 6px 0 0; color: #adadb8; font-size: 12px; max-width: 100%; }
  .cap b { color: #fff; }

  /* The Twitch player: 16:9, stream ghost scaled by container width (cqw), extension drawn on top in fixed CSS px like a real overlay iframe. */
  .player { position: relative; aspect-ratio: 16 / 9; container-type: inline-size; overflow: hidden; background: #000; outline: 1px solid #333; }
  .stream { position: absolute; inset: 0; font: 600 0.94cqw/1.3 'Segoe UI', sans-serif; color: #fff; text-shadow: 0 .1cqw .15cqw #000;
    background: radial-gradient(40% 50% at 30% 60%, #4a5a2e, #0000), radial-gradient(35% 40% at 70% 35%, #5d5233, #0000), radial-gradient(30% 30% at 62% 75%, #2f4a52, #0000), #33402a; }
  .stream.off { background: radial-gradient(30% 45% at 50% 55%, #5a5560, #0000), #2a2730; }
  .stream.off::after { content: 'Just Chatting · Rhino Race is not running'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff8; font-size: 1.6cqw; }
  .g { position: absolute; background: #080b10cc; padding: .4cqw .7cqw; white-space: nowrap; overflow: hidden; }
  .g.standings { left: 1.25cqw; top: 1.25cqw; width: 18.75cqw; padding: 0; border-left: .26cqw solid #db3030; }
  .g.standings header { padding: .6cqw .8cqw; background: var(--red); font-weight: 800; font-size: 1cqw; }
  .g.standings div { display: grid; grid-template-columns: 1.8cqw 1fr 3cqw; padding: .25cqw .5cqw; border-top: 1px solid #fff1; font-size: .88cqw; }
  .g.standings strong { color: var(--gold); }
  .g.standings div.me { background: #fff3; }
  .g.chatcol { left: 1.25cqw; bottom: 4.7cqw; width: 18.75cqw; background: none; padding: 0; font-weight: 400; font-size: .78cqw; }
  .g.chatcol div { margin-top: .2cqw; padding: .25cqw .5cqw; background: #080b10cc; }
  .g.phase { right: 1.25cqw; top: 1.25cqw; font-size: 1.15cqw; }
  .g.queue { right: 1.25cqw; top: 3.95cqw; display: flex; gap: .3cqw; background: none; padding: 0; font-size: .73cqw; }
  .g.queue span { padding: .2cqw .5cqw; background: #080b10cc; color: #bbb; }
  .g.queue .hype { min-width: 4.7cqw; text-align: center; color: #fff; background: linear-gradient(90deg, #d8a520 var(--fill), #080b10cc var(--fill)); }
  .g.queue .armed { background: var(--gold); color: var(--ink); font-weight: 700; }
  .g.feed { right: 1.25cqw; bottom: 1.25cqw; width: 24cqw; background: none; padding: 0; text-align: right; font-size: .83cqw; }
  .g.feed div { margin-top: .26cqw; padding: .3cqw .6cqw; background: #080b10cc; border-right: .2cqw solid #db3030; }
  .g.commands { left: 1.25cqw; bottom: 1.25cqw; font-size: .83cqw; }
  .g.banner { left: 50%; top: 1.25cqw; transform: translateX(-50%); padding: .5cqw 1.5cqw; background: var(--red); font-size: 1.56cqw; text-align: center; }
  .g.setup { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 38cqw; height: 26cqw; background: #0c1117ee; border-top: 2.2cqw solid #b01a1a; color: #fff6; text-align: center; }
  .chrome { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: linear-gradient(#0000, #000a); opacity: .55; pointer-events: none; }
  .chrome::before { content: '▶  🔊 ───────────────────────────  ⚙ ⛶'; position: absolute; left: 14px; bottom: 10px; color: #fff; font-size: 13px; white-space: nowrap; }

  /* Shared extension parts. Everything inside .ext is in CSS px times --s, since a real overlay doesn't scale with the stream. */
  .ext { position: absolute; z-index: 2; font-family: 'Segoe UI', sans-serif; color: #fff; text-shadow: none; }
  .ext button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  .ext .bits { color: #bf94ff; font-weight: 700; }
  .ext .bits::before { content: '◆'; margin-right: 2px; font-size: .85em; }
  .ext .fail { color: #ffc9c9; background: #b81c1c40; border: 1px solid #e23a3a77; }
  .ext button:disabled { opacity: .45; cursor: default; }
  .cd { color: var(--gold); font-variant-numeric: tabular-nums; }

  /* A: Stream Racer rail. 72 px icon strip, right edge, vertically centred; hover opens a card to its left. */
  .A { right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: row-reverse; align-items: center; font-size: calc(11px * var(--s)); }
  .A .rail { width: calc(72px * var(--s)); display: flex; flex-direction: column; gap: calc(4px * var(--s)); padding: calc(6px * var(--s)) 0; background: #080b10e6; border-left: calc(3px * var(--s)) solid var(--red); box-sizing: border-box; align-items: center; }
  .A .tile { width: calc(60px * var(--s)); padding: calc(5px * var(--s)) 0; text-align: center; background: #ffffff0d; }
  .A .tile big { display: block; font: 900 calc(26px * var(--s))/1 'Barlow Condensed', sans-serif; }
  .A .tile small { color: var(--dim); }
  .A .ib { width: calc(60px * var(--s)); height: calc(46px * var(--s)); background: linear-gradient(#36414e, #1e2730); display: grid; place-content: center; text-align: center; line-height: 1.05; }
  .A .ib i { font-style: normal; font-size: calc(17px * var(--s)); display: block; }
  .A .ib.paid { background: linear-gradient(#3b2a5c, #22183a); }
  .A .ib.join, .A .ib.nuke { height: calc(56px * var(--s)); background: linear-gradient(#d22a2a, #9c1414); font-weight: 800; }
  .A .ib.nuke { background: linear-gradient(#ffd34e, #d8a520); color: var(--ink); }
  .A .sep { width: calc(40px * var(--s)); height: 1px; background: #fff3; }
  .A .card { display: none; width: calc(250px * var(--s)); margin-right: calc(6px * var(--s)); padding: calc(10px * var(--s)); background: #080b10f2; font-size: calc(13px * var(--s)); box-shadow: 0 8px 24px #000a; }
  .A:hover .card, .A.pin .card { display: block; }
  .A .card h3 { margin: 0 0 6px; font: 900 calc(18px * var(--s))/1 'Barlow Condensed', sans-serif; letter-spacing: .05em; text-transform: uppercase; }
  .A .card p { margin: 4px 0; color: var(--dim); }
  .A .fail { font-size: calc(10px * var(--s)); width: calc(60px * var(--s)); padding: 3px; box-sizing: border-box; text-align: center; }

  /* B: labelled side panel. Always open, right edge under the hype queue, about 220 px wide. */
  .B { right: calc(12px * var(--s)); top: calc(14% + 8px); width: calc(220px * var(--s)); background: #0c1117ee; font-size: calc(13px * var(--s)); box-shadow: 0 8px 22px #000c; }
  .B header { display: flex; justify-content: space-between; align-items: baseline; padding: calc(6px * var(--s)) calc(10px * var(--s)); background: linear-gradient(#d22a2a, #9c1414); font: 900 calc(16px * var(--s))/1.1 'Barlow Condensed', sans-serif; letter-spacing: .06em; }
  .B header small { font: 600 calc(11px * var(--s)) 'Segoe UI', sans-serif; color: #ffd6d6; letter-spacing: 0; }
  .B .me { display: flex; align-items: baseline; gap: 8px; padding: calc(8px * var(--s)) calc(10px * var(--s)); border-bottom: 1px solid #fff2; }
  .B .me big { font: 900 calc(38px * var(--s))/1 'Barlow Condensed', sans-serif; }
  .B .me small { color: var(--dim); }
  .B h4 { margin: 0; padding: calc(7px * var(--s)) calc(10px * var(--s)) calc(3px * var(--s)); color: var(--dim); font-size: calc(10px * var(--s)); letter-spacing: .1em; text-transform: uppercase; }
  .B .btns { display: grid; grid-template-columns: 1fr 1fr; gap: calc(4px * var(--s)); padding: 0 calc(10px * var(--s)) calc(6px * var(--s)); }
  .B .btns button { padding: calc(6px * var(--s)) calc(8px * var(--s)); text-align: left; background: linear-gradient(#36414e, #1e2730); display: flex; justify-content: space-between; gap: 4px; }
  .B .btns button.paid { background: linear-gradient(#3b2a5c, #22183a); }
  .B .big { display: block; width: calc(100% - 20px * var(--s)); margin: calc(8px * var(--s)) calc(10px * var(--s)); padding: calc(10px * var(--s)); background: linear-gradient(#d22a2a, #9c1414); font: 900 calc(20px * var(--s))/1 'Barlow Condensed', sans-serif; letter-spacing: .06em; }
  .B .big.nuke { background: linear-gradient(#ffd34e, #d8a520); color: var(--ink); }
  .B .note { padding: calc(4px * var(--s)) calc(10px * var(--s)) calc(10px * var(--s)); color: var(--dim); font-size: calc(12px * var(--s)); }
  .B .fail { margin: 0 calc(10px * var(--s)) calc(8px * var(--s)); padding: 4px 8px; font-size: calc(12px * var(--s)); }

  /* C: top strip. One row across the top centre, between standings and phase; ~40 px tall. */
  .C { left: 50%; top: 0; transform: translateX(-50%); display: flex; align-items: stretch; height: calc(40px * var(--s)); background: #080b10ee; border-bottom: calc(3px * var(--s)) solid var(--red); font-size: calc(13px * var(--s)); white-space: nowrap; box-shadow: 0 4px 14px #0009; }
  .C > * { display: flex; align-items: center; gap: 5px; padding: 0 calc(10px * var(--s)); }
  .C .tag { background: var(--red); font: 900 calc(15px * var(--s))/1 'Barlow Condensed', sans-serif; letter-spacing: .06em; }
  .C .me big { font: 900 calc(26px * var(--s))/1 'Barlow Condensed', sans-serif; }
  .C .me small { color: var(--dim); }
  .C button { padding: 0 calc(9px * var(--s)); background: none; border-left: 1px solid #fff2; height: 100%; }
  .C button:hover { background: #fff1; }
  .C button.join, .C button.nuke { background: linear-gradient(#d22a2a, #9c1414); font-weight: 800; padding: 0 calc(18px * var(--s)); }
  .C button.nuke { background: linear-gradient(#ffd34e, #d8a520); color: var(--ink); }
  .C .fail { font-size: calc(12px * var(--s)); border: 0; }
  .C .wait { color: var(--dim); }

  /* Phone: Twitch app with the video on top and the extension's mobile view below, where chat would be. */
  .phone { width: 360px; height: 740px; border-radius: 36px; padding: 12px; background: #000; box-shadow: 0 0 0 2px #444; display: flex; flex-direction: column; box-sizing: border-box; }
  .phone .bar { height: 22px; color: #fff; font-size: 11px; padding: 0 14px; }
  .phone .player { width: 100%; outline: 0; }
  .phone .tabs { display: flex; gap: 16px; padding: 8px 12px; font-size: 12px; color: #adadb8; border-bottom: 1px solid #333; }
  .phone .tabs b { color: #fff; border-bottom: 2px solid #bf94ff; }
  .mob { flex: 1; overflow: auto; background: #0c1117; padding: 12px; font-size: 14px; }
  .mob .me { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #ffffff0d; border-left: 4px solid var(--house, var(--red)); }
  .mob .me big { font: 900 44px/1 'Barlow Condensed', sans-serif; }
  .mob .me small { color: var(--dim); display: block; }
  .mob h4 { margin: 14px 0 6px; color: var(--dim); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .mob .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mob button { min-height: 48px; padding: 6px; background: linear-gradient(#36414e, #1e2730); border: 0; color: #fff; font: 600 13px 'Segoe UI', sans-serif; }
  .mob button.paid { background: linear-gradient(#3b2a5c, #22183a); }
  .mob button i { display: block; font-style: normal; font-size: 18px; }
  .mob .big { width: 100%; min-height: 56px; margin-top: 10px; background: linear-gradient(#d22a2a, #9c1414); font: 900 24px/1 'Barlow Condensed', sans-serif; letter-spacing: .06em; }
  .mob .big.nuke { background: linear-gradient(#ffd34e, #d8a520); color: var(--ink); }
  .mob .idle { margin-top: 40px; text-align: center; color: var(--dim); }
  .mob .fail { margin-top: 8px; padding: 6px 10px; color: #ffc9c9; background: #b81c1c40; border: 1px solid #e23a3a77; }
  .mob .bits { color: #bf94ff; font-weight: 700; }
  .mob .bits::before { content: '◆'; margin-right: 2px; font-size: .85em; }
  .mob button:disabled { opacity: .45; }

  /* Cooldown, three ways (?cd=wipe|collapse|charge). The personal buttons count down together; --p is the share of the wait left. */
  .ib, .mob button { position: relative; overflow: hidden; }
  .grp { position: relative; align-self: stretch; display: flex; flex-direction: column; align-items: center; gap: calc(4px * var(--s)); }
  .cdn { position: absolute; inset: 0; display: none; place-content: center; z-index: 1; font: 900 calc(24px * var(--s))/1 'Barlow Condensed', sans-serif; color: #fff; text-shadow: 0 1px 3px #000; }
  .mob .cdn { font-size: 26px; }
  .cooling button.pers:disabled { opacity: 1; }
  .cdbar, .cdslot, .cdline { display: none; }
  .cdline { color: var(--gold); font-size: calc(10px * var(--s)); font-variant-numeric: tabular-nums; }
  .mob .cdline { font-size: 13px; }

  /* 1 Clock wipe: each button is an RA2 build cameo; a dark sweep clears clockwise, seconds on top, the used one outlined. */
  .cd-wipe .cooling button.pers > :not(.cdn) { opacity: .15; }
  .cd-wipe .cooling button.pers::after { content: ''; position: absolute; inset: 0; background: conic-gradient(#0000 calc((1 - var(--p, 1)) * 360deg), #000c 0); }
  .cd-wipe .cooling .cdn { display: grid; }
  .cd-wipe .cooling button.used { outline: 2px solid var(--gold); outline-offset: -2px; }

  /* 2 Collapse: the five buttons fold into one countdown slot naming what was used; the rail is shorter while you wait. */
  .cd-collapse .cooling :is(button.pers, .sep, .pers-h, .pers-g) { display: none; }
  .cd-collapse .cooling .cdslot { display: flex; }
  .cdslot { flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; color: var(--dim); font-size: calc(10px * var(--s)); text-align: center; }
  .cdslot .ring { position: relative; width: calc(48px * var(--s)); height: calc(48px * var(--s)); border-radius: 50%; background: conic-gradient(var(--gold) calc((1 - var(--p, 1)) * 360deg), #ffffff1f 0); }
  .cdslot .ring::before { content: ''; position: absolute; inset: calc(4px * var(--s)); border-radius: 50%; background: #080b10; }
  .cdslot .cdn { display: grid; font-size: calc(20px * var(--s)); }
  .mob .cdslot { flex-direction: row; gap: 12px; margin-top: 14px; padding: 10px 12px; background: #ffffff0d; font-size: 14px; text-align: left; }
  .mob .cdslot .ring { width: 56px; height: 56px; }
  .mob .cdslot .cdn { font-size: 24px; }

  /* 3 Charge: one segmented power bar on the rail's edge (the RA2 sidebar's power meter) refills; buttons stay put, hatched and locked; seconds in the place tile. */
  .cd-charge .cooling button.pers > * { opacity: .45; filter: grayscale(1); }
  .cd-charge .cooling button.pers::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, #000b 0 3px, #0000 3px 7px); }
  .cd-charge .cooling .cdbar { display: block; position: absolute; left: 0; top: 0; bottom: 0; width: calc(4px * var(--s));
    background: linear-gradient(to top, var(--gold) calc((1 - var(--p, 1)) * 100%), #ffffff26 0); mask-image: repeating-linear-gradient(to top, #000 0 calc(6px * var(--s)), #0000 0 calc(8px * var(--s))); }
  .cd-charge .mob .cooling .cdbar { position: static; width: auto; height: 8px; margin-top: 14px;
    background: linear-gradient(to right, var(--gold) calc((1 - var(--p, 1)) * 100%), #ffffff26 0); mask-image: repeating-linear-gradient(to right, #000 0 14px, #0000 0 17px); }
  .cd-charge :is(.ext, .mob):has(.cooling) .cdline { display: block; }
  .ready button.pers { animation: ready .6s; }
  @keyframes ready { 0% { box-shadow: inset 0 0 0 2px var(--gold); } 100% { box-shadow: none; } }

  .grid-all { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 22px; width: 100%; }
  .grid-all .player { width: 100%; }

  /* The prototype switcher: not part of the design. */
  #switcher { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 99; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; max-width: calc(100vw - 32px);
    padding: 8px 12px; background: #fff; color: #111; border-radius: 14px; box-shadow: 0 6px 24px #000c; font: 600 13px 'Segoe UI', sans-serif; }
  #switcher button, #switcher select { font: inherit; padding: 4px 9px; border: 1px solid #ccc; border-radius: 8px; background: #f4f4f4; cursor: pointer; }
  #switcher button.on { background: #111; color: #fff; border-color: #111; }
  #switcher .label { min-width: 190px; text-align: center; }
  #switcher hr { width: 100%; margin: 2px 0; border: 0; }
</style>
</head>
<body>
<main id="app"></main>
<div id="switcher"></div>
<script>
// Viewer's house colour (Magenta, brightest shade) and the other racers in the ghost standings.
const ME = { name: 'p0mz0r', colour: '#ff4fd8' };
const FIELD = [['Kane', '#ff5050'], ['zed_rush', '#5f8bff'], ['Tanya99', '#ffe14a'], ['Boris', '#b066ff'], ['ivan_k', '#5cff5c'], ['CABAL', '#ff7a3a', 1], ['yuri', '#8f7bff'], [ME.name, ME.colour], ['Eva', '#55d4ff'], ['Seth', '#3ccf5a']];

// Each state: game phase, the viewer (racing or not), and anything extra the rail shows.
const STATES = {
  off:       { label: 'Game off', phase: 'off' },
  between:   { label: 'Between races', phase: 'between' },
  identity:  { label: 'Join · identity not shared', phase: 'join', shared: false },
  join:      { label: 'Join window open', phase: 'join', shared: true },
  racing:    { label: 'Racing', phase: 'race', me: { place: 8, pct: 63 } },
  cooldown:  { label: 'Racing · cooldown + failure', phase: 'race', me: { place: 6, pct: 71 }, cooldown: 30, used: 'Missile', fail: 'Missile blocked: Kane\'s shield', banner: 'KIROV AIRSHIP · zed_rush' },
  spectator: { label: 'Racing · not a racer', phase: 'race' },
  finished:  { label: 'Finished', phase: 'race', me: { place: 3, pct: 100, done: true } },
  nuke:      { label: 'Nuke armed', phase: 'race', me: { place: 8, pct: 58 }, nuke: [7, 12] },
};
const KEYS = Object.keys(STATES);
const VARIANTS = { A: 'Stream Racer rail, 72 px', B: 'Labelled side panel, 220 px', C: 'Top strip, 40 px' };

// The buttons available now, per #168 and #170: random-tank interactions for anyone, own-tank ones for an unfinished racer, Bits events during a race.
function actions(s) {
  if (s.phase !== 'race') return { random: [], own: [], paid: [] };
  const cd = s.cooldown;
  const b = (icon, label) => ({ icon, label, cd, used: s.used === label });
  return {
    random: [b('»', 'Boost'), b('➶', 'Missile'), b('ϟ', 'Tesla')],
    own: s.me && !s.me.done ? [b('⛨', 'Shield'), b('⇉', 'V3')] : [],
    paid: [{ icon: '☣', label: 'Desolator', bits: 10 }, { icon: '⧗', label: 'Chrono swap', bits: 20 }, { icon: '✈', label: 'Kirov', bits: 50 }],
  };
}
const place = (s) => `<big style="color:${ME.colour}">P${s.me.place}</big>`;
const pct = (s) => s.me.done ? 'finished' : `${s.me.pct}%`;

// ---------- stream ghost ----------
function stream(s) {
  if (s.phase === 'off') return '<div class="stream off"></div>';
  if (s.phase === 'between') return `<div class="stream"><div class="g setup">RACE SETUP</div><div class="g phase">RHINO RACE</div></div>`;
  const field = s.phase === 'join' ? FIELD.slice(0, 6) : FIELD;
  let order = field.map(([n, c, bot], i) => ({ n, c, bot, p: Math.max(5, 92 - i * 7) }));
  if (s.me && s.phase === 'race') { order = order.filter((r) => r.n !== ME.name); order.splice(s.me.place - 1, 0, { n: ME.name, c: ME.colour, p: s.me.pct }); }
  const rows = order.map((r, i) => `<div class="${r.n === ME.name ? 'me' : ''}"><strong>${i + 1}</strong><span style="color:${r.c}">${r.n}${r.bot ? ' <small>BOT</small>' : ''}</span><b>${s.phase === 'join' ? '' : r.p + '%'}</b></div>`).join('');
  const chat = ['Kane !missile', 'zed_rush gg', 'Tanya99 !boost Boris', 'ivan_k lol that tesla'].map((t) => `<div>${t}</div>`).join('');
  const race = s.phase === 'race';
  return `<div class="stream">
    <div class="g standings"><header>Tour of Siberia</header>${rows}</div>
    <div class="g chatcol">${chat}</div>
    ${s.banner ? `<div class="g banner">${s.banner}</div>` : `<div class="g phase">${race ? 'RACE LIVE' : 'JOIN WINDOW · 23 s'}</div>`}
    ${race ? `<div class="g queue">${s.nuke ? `<span class="armed">NUKE ${s.nuke[0]}/${s.nuke[1]}</span>` : '<span class="hype" style="--fill:40%">HYPE</span>'}<span>Chrono swap · Eva</span></div>` : ''}
    ${race ? `<div class="g feed"><div><span style="color:#ff5050">Kane</span> stunned <span style="color:#ffe14a">Tanya99</span></div><div>Eva boosted <span style="color:#5f8bff">zed_rush</span></div><div>Tesla failed: Seth is on cooldown</div></div>` : ''}
    <div class="g commands">${race ? '!boost &nbsp; !missile &nbsp; !tesla &nbsp; !shield &nbsp; !v3' + (s.nuke ? ' &nbsp; !nuke' : '') : '!rhino'}</div>
  </div>`;
}

// ---------- variant A ----------
function A(s) {
  if (s.phase === 'off') return '';
  const a = actions(s);
  // Personal buttons share one viewer cooldown; Bits buttons never wait.
  const ib = (x, cls = '') => `<button class="ib ${cls}${x.bits ? '' : ' pers'}${x.used ? ' used' : ''}" title="${x.label}" ${x.cd ? 'disabled' : ''}><span><i>${x.icon}</i>${x.bits ? `<span class="bits">${x.bits}</span>` : x.label}</span>${x.bits ? '' : '<b class="cdn"></b>'}</button>`;
  let rail = '', card = '';
  if (s.phase === 'between') { rail = `<div class="tile"><b>RHINO</b><br><small>next race soon</small></div>`; card = `<h3>Rhino Race</h3><p>The next race opens here. Join from this rail when it does.</p>`; }
  else if (s.phase === 'join') {
    rail = `<div class="tile"><big class="cd">23</big><small>6 / 24</small></div><button class="ib join">${s.shared ? 'JOIN' : 'JOIN*'}</button>`;
    card = `<h3>Join window · 23 s</h3><p>6 of 24 racers.</p>${s.shared ? '<p>Join to get a tank in this race.</p>' : '<p><b>Joining shares your Twitch name</b> with Rhino Race, so your tank carries it. Twitch asks you once.</p>'}`;
  } else {
    const cdline = s.cooldown ? '<span class="cdline">ready <b class="cdt"></b>s</span>' : '';
    rail = (s.me ? `<div class="tile">${place(s)}<small>${pct(s)}</small>${cdline}</div>` : `<div class="tile"><b>RACE</b><br><small>on</small>${cdline}</div>`)
      + (s.nuke ? `<button class="ib nuke">☢<br>NUKE<br>${s.nuke[0]}/${s.nuke[1]}</button>` : '')
      + (s.fail ? `<div class="fail">${s.fail}</div>` : '')
      + `<div class="grp${s.cooldown ? ' cooling' : ''}" ${s.cooldown ? `data-cd="${s.cooldown}"` : ''}><div class="cdbar"></div>`
      + (s.cooldown ? `<div class="cdslot"><div class="ring"><b class="cdn"></b></div>${s.used}<br>used</div>` : '')
      + a.own.map((x) => ib(x)).join('') + (a.own.length ? '<div class="sep"></div>' : '')
      + a.random.map((x) => ib(x)).join('') + '</div><div class="sep"></div>' + a.paid.map((x) => ib(x, 'paid')).join('');
    card = `<h3>${s.me ? `<span style="color:${ME.colour}">P${s.me.place}</span> of 10 · ${pct(s)}` : 'Race on'}</h3>`
      + (a.own.length ? '<p>⛨ Shield, ⇉ V3: your own tank.</p>' : '') + '<p>» Boost, ➶ Missile, ϟ Tesla: a random tank.</p><p>☣ ⧗ ✈ Big events, with Bits.</p>' + (s.cooldown ? `<p class="cd">${s.used} used · next in <span class="cdt"></span> s</p>` : '');
  }
  return `<div class="ext A"><div class="rail">${rail}</div><div class="card">${card}</div></div>`;
}

// ---------- variant B ----------
function B(s) {
  if (s.phase === 'off') return '';
  const a = actions(s);
  const btn = (x, cls = '') => `<button class="${cls}" ${x.cd ? 'disabled' : ''}><span>${x.icon} ${x.label}</span>${x.bits ? `<span class="bits">${x.bits}</span>` : x.cd ? `<span class="cd">${x.cd}s</span>` : ''}</button>`;
  let body = '';
  if (s.phase === 'between') return `<div class="ext B"><header>RHINO RACE <small>between races</small></header><div class="note">The next race opens here.</div></div>`;
  if (s.phase === 'join') body = `<div class="note">6 of 24 racers</div><button class="big">JOIN RACE</button>${s.shared ? '' : '<div class="note">Joining shares your Twitch name with Rhino Race. Twitch asks once.</div>'}`;
  else body = (s.me ? `<div class="me">${place(s)}<small>${pct(s)}</small></div>` : '<div class="note">You\'re watching. Help or hinder anyone.</div>')
    + (s.nuke ? `<button class="big nuke">☢ NUKE ${s.nuke[0]}/${s.nuke[1]}</button>` : '')
    + (s.fail ? `<div class="fail">${s.fail}</div>` : '')
    + (a.own.length ? `<h4>Your tank</h4><div class="btns">${a.own.map((x) => btn(x)).join('')}</div>` : '')
    + `<h4>A random tank</h4><div class="btns">${a.random.map((x) => btn(x)).join('')}</div>`
    + `<h4>Big events</h4><div class="btns">${a.paid.map((x) => btn(x, 'paid')).join('')}</div>`;
  const head = s.phase === 'join' ? `JOIN <small class="cd">23 s</small>` : `RHINO RACE <small>${s.me ? 'racing' : 'race on'}</small>`;
  return `<div class="ext B"><header>${head}</header>${body}</div>`;
}

// ---------- variant C ----------
function C(s) {
  if (s.phase === 'off') return '';
  const a = actions(s);
  const btn = (x) => `<button ${x.cd ? 'disabled' : ''}>${x.icon} ${x.label}${x.bits ? ` <span class="bits">${x.bits}</span>` : ''}</button>`;
  let row = '';
  if (s.phase === 'between') row = `<div class="wait">next race soon</div>`;
  else if (s.phase === 'join') row = `<div><span class="cd">23 s</span>&nbsp;<span class="wait">6 / 24</span></div>${s.shared ? '' : '<div class="wait">shares your Twitch name</div>'}<button class="join">JOIN</button>`;
  else row = (s.me ? `<div class="me">${place(s)}<small>${pct(s)}</small></div>` : '')
    + (s.nuke ? `<button class="nuke">☢ NUKE ${s.nuke[0]}/${s.nuke[1]}</button>` : '')
    + (s.cooldown ? `<div class="cd">${s.cooldown}s</div>` : '')
    + [...a.own, ...a.random].map(btn).join('') + a.paid.map(btn).join('')
    + (s.fail ? `<div class="fail">${s.fail}</div>` : '');
  return `<div class="ext C"><div class="tag">RHINO</div>${row}</div>`;
}

// ---------- mobile (shared) ----------
function mobile(s) {
  if (s.phase === 'off') return `<div class="idle">Rhino Race isn't running on this stream right now.</div>`;
  if (s.phase === 'between') return `<div class="idle"><b style="font:900 24px 'Barlow Condensed'">RHINO RACE</b><br>Between races. Join opens here when the next one starts.</div>`;
  if (s.phase === 'join') return `<div class="me"><div><big class="cd">23 s</big><small>Join window · 6 of 24 racers</small></div></div><button class="big">JOIN RACE</button>${s.shared ? '' : '<p style="color:var(--dim)">Joining shares your Twitch name with Rhino Race, so your tank carries it. Twitch asks once.</p>'}`;
  const a = actions(s);
  const btn = (x, cls = '') => `<button class="${cls}${x.bits ? '' : ' pers'}${x.used ? ' used' : ''}" ${x.cd ? 'disabled' : ''}><i>${x.icon}</i>${x.label}${x.bits ? `<br><span class="bits">${x.bits}</span>` : '<b class="cdn"></b>'}</button>`;
  const cdline = s.cooldown ? '<span class="cdline">ready in <b class="cdt"></b> s</span>' : '';
  return `<div class="${s.cooldown ? 'cooling' : ''}" ${s.cooldown ? `data-cd="${s.cooldown}"` : ''}>` + (s.me ? `<div class="me" style="--house:${ME.colour}">${place(s)}<div><b>${ME.name}</b><small>${pct(s)}</small>${cdline}</div></div>` : `<div class="me"><div><b>Race on</b><small>You're watching. Help or hinder anyone.</small>${cdline}</div></div>`)
    + (s.nuke ? `<button class="big nuke">☢ NUKE ${s.nuke[0]}/${s.nuke[1]}</button>` : '')
    + (s.fail ? `<div class="fail">${s.fail}</div>` : '')
    + '<div class="cdbar"></div>'
    + (s.cooldown ? `<div class="cdslot"><div class="ring"><b class="cdn"></b></div><div><b style="color:#fff">${s.used} used</b><br>Boost, Missile, Tesla, Shield and V3 are back when the ring closes.</div></div>` : '')
    + (a.own.length ? `<h4 class="pers-h">Your tank</h4><div class="grid pers-g">${a.own.map((x) => btn(x)).join('')}</div>` : '')
    + `<h4 class="pers-h">A random tank</h4><div class="grid pers-g">${a.random.map((x) => btn(x)).join('')}</div>`
    + `<h4>Big events</h4><div class="grid">${a.paid.map((x) => btn(x, 'paid')).join('')}</div></div>`;
}

// ---------- page ----------
const params = new URLSearchParams(location.search);
let variant = VARIANTS[params.get('variant')] ? params.get('variant') : 'A';
let state = params.get('state') === 'all' || STATES[params.get('state')] ? params.get('state') : 'racing';
let width = Number(params.get('w')) || 1100;
let scale = Number(params.get('s')) || 1;
let pin = params.get('pin') === '1';
const CD_STYLES = { wipe: '1 Clock wipe', collapse: '2 Collapse', charge: '3 Charge bar' };
let cdStyle = CD_STYLES[params.get('cd')] ? params.get('cd') : 'wipe';

// Live cooldown: starts 12 s before the end so the ready flash comes soon, holds 2 s ready, then loops.
let cdStart = performance.now();
setInterval(() => {
  document.querySelectorAll('[data-cd]').forEach((g) => {
    const cd = Number(g.dataset.cd), t = ((performance.now() - cdStart) / 1000 % 14) + cd - 12, left = Math.max(0, cd - t);
    g.style.setProperty('--p', left / cd);
    g.classList.toggle('cooling', left > 0);
    g.classList.toggle('ready', left === 0);
    g.querySelectorAll('.cdn').forEach((n) => { n.textContent = Math.ceil(left); });
    g.querySelectorAll('button.pers').forEach((b) => { b.disabled = left > 0; });
    g.closest('.player, .ext, .phone')?.querySelectorAll('.cdt').forEach((n) => { n.textContent = Math.ceil(left); });
  });
}, 100);
const RENDER = { A, B, C };

function player(key, w) {
  const s = STATES[key];
  return `<div><div class="player" style="${w ? `width:${w}px` : ''}">${stream(s)}${RENDER[variant](s).replace('ext A', 'ext A' + (pin ? ' pin' : ''))}<div class="chrome"></div></div><p class="cap" data-cap="${key}"><b>${s.label}</b></p></div>`;
}

function render() {
  document.documentElement.style.setProperty('--s', scale);
  document.body.className = 'cd-' + cdStyle;
  cdStart = performance.now();
  const app = document.getElementById('app');
  if (state === 'all') app.innerHTML = `<div class="grid-all">${KEYS.map((k) => player(k)).join('')}</div>`;
  else app.innerHTML = player(state, Math.min(width, innerWidth - 40 - (innerWidth > 1500 ? 400 : 0)))
    + `<div><div class="phone"><div class="bar">9:41</div><div class="player">${stream(STATES[state])}</div><div class="tabs"><b>Rhino Race</b><span>Chat</span><span>About</span></div><div class="mob">${mobile(STATES[state])}</div></div><p class="cap"><b>Mobile view</b> (same for every variant)</p></div>`;
  // Surface the size: measured rail box against the player.
  document.querySelectorAll('.player').forEach((p) => {
    const ext = p.querySelector('.ext'), cap = p.parentElement.querySelector('[data-cap]');
    if (!cap) return;
    const pr = p.getBoundingClientRect(), r = ext?.getBoundingClientRect();
    cap.innerHTML = `<b>${STATES[cap.dataset.cap].label}</b> · player ${Math.round(pr.width)}×${Math.round(pr.height)} · `
      + (r ? `extension ${Math.round(r.width)}×${Math.round(r.height)} px (${Math.round(r.width * r.height / pr.width / pr.height * 100)}% of the video)` : 'nothing drawn');
  });
  const url = new URLSearchParams({ variant, state, w: width, s: scale, cd: cdStyle, ...(pin ? { pin: 1 } : {}) });
  history.replaceState(null, '', '?' + url);
  const sw = document.getElementById('switcher');
  sw.innerHTML = `<button data-v="-1">←</button><span class="label">${variant} (${VARIANTS[variant]})</span><button data-v="1">→</button>
    <select data-w>${[1600, 1280, 1100, 854, 640].map((w) => `<option ${w === width ? 'selected' : ''}>${w}</option>`).join('')}</select>px
    size <input data-s type="range" min="0.75" max="1.5" step="0.05" value="${scale}" style="width:80px">${scale}×
    ${variant === 'A' ? `<label><input data-pin type="checkbox" ${pin ? 'checked' : ''}> card open</label>
      cooldown <select data-cdstyle>${Object.entries(CD_STYLES).map(([k, v]) => `<option value="${k}" ${k === cdStyle ? 'selected' : ''}>${v}</option>`).join('')}</select>` : ''}
    <hr>${KEYS.map((k, i) => `<button data-st="${k}" class="${k === state ? 'on' : ''}">${i + 1} ${STATES[k].label}</button>`).join('')}<button data-st="all" class="${state === 'all' ? 'on' : ''}">0 All</button>`;
}

const cycle = (d) => { const v = Object.keys(VARIANTS); variant = v[(v.indexOf(variant) + d + v.length) % v.length]; render(); };
document.getElementById('switcher').addEventListener('click', (e) => {
  const t = e.target.closest('[data-v],[data-st]');
  if (!t) return;
  if (t.dataset.v) cycle(Number(t.dataset.v)); else { state = t.dataset.st; render(); }
});
document.getElementById('switcher').addEventListener('change', (e) => {
  if (e.target.matches('[data-w]')) width = Number(e.target.value);
  if (e.target.matches('[data-s]')) scale = Number(e.target.value);
  if (e.target.matches('[data-pin]')) pin = e.target.checked;
  if (e.target.matches('[data-cdstyle]')) cdStyle = e.target.value;
  render();
});
addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  else if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === '0') { state = 'all'; render(); }
  else if (KEYS[Number(e.key) - 1]) { state = KEYS[Number(e.key) - 1]; render(); }
});
addEventListener('resize', render);
render();
</script>
</body>
</html>
